name: Deploy PartyKit

on:
  push:
    branches: [main]
    paths:
      - party/**
      - src/protocol.ts
      - partykit.json
      - package.json
      - package-lock.json
      - .github/workflows/partykit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >-
          npx partykit deploy
          --var ENTRA_TENANT_ID="$ENTRA_TENANT_ID"
          ENTRA_API_AUDIENCE="$ENTRA_API_AUDIENCE"
          ENTRA_API_SCOPE="$ENTRA_API_SCOPE"
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_API_AUDIENCE: ${{ vars.ENTRA_API_AUDIENCE }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE_NAME }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
